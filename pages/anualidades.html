<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Anualidades | Ingeniería Económica</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../style2.css">
</head>

<body>
    <iframe class="nav-frame" src="templates/nav.html" title="Navegación principal" scrolling="no"></iframe>
    <script>window.addEventListener("message", function (event) { if (!event.data || event.data.type !== "nav-toggle") return; var frame = document.querySelector(".nav-frame"); if (frame) frame.style.height = event.data.open ? "300px" : "72px"; });</script>
    <header class="page-header">
        <div class="container">
            <h2>Anualidades</h2>
            <p class="mb-0">Una sola calculadora para anualidades vencidas, anticipadas, diferidas y generales. Calcula
                valor presente o valor futuro.</p>
        </div>
    </header>
    <main class="container py-4">
        <div class="row g-4">
            <section class="col-lg-5">
                <div class="calc-card">
                    <h5>Configuración del flujo</h5>
                    <p class="text-muted small">La tasa debe corresponder al período de cada pago, salvo en una
                        anualidad general.</p><label class="form-label" for="tipoA">Tipo de anualidad</label><select
                        id="tipoA" class="form-select mb-3">
                        <option value="vencida">Ordinaria o vencida</option>
                        <option value="anticipada">Anticipada</option>
                        <option value="diferida">Diferida</option>
                        <option value="general">General</option>
                    </select><label class="form-label" for="objetivoA">Resultado</label><select id="objetivoA"
                        class="form-select mb-3">
                        <option value="vp">Valor presente (VP)</option>
                        <option value="vf">Valor futuro (VF)</option>
                    </select>
                    <div class="mb-3"><label class="form-label" for="A">Cuota o pago periódico (A)</label><input id="A"
                            type="number" class="form-control" min="0" step="any" placeholder="Ej: 500000"></div>
                    <div class="mb-3"><label class="form-label" for="iA">Tasa por período de pago (%)</label><input
                            id="iA" type="number" class="form-control" min="0.000001" step="any" placeholder="Ej: 1.5">
                    </div>
                    <div id="generalFields" class="d-none border rounded p-3 mb-3 bg-light">
                        <div class="section-kicker mb-2">Conversión de anualidad general</div><label class="form-label"
                            for="jA">Tasa nominal anual (%)</label><input id="jA" type="number"
                            class="form-control mb-2" min="0" step="any" placeholder="Ej: 24"><label class="form-label"
                            for="capA">Capitalización de la tasa</label><select id="capA" class="form-select mb-2">
                            <option>Mensual</option>
                            <option>Trimestral</option>
                            <option>Semestral</option>
                            <option selected>Anual</option>
                        </select><label class="form-label" for="payA">Periodicidad de los pagos</label><select id="payA"
                            class="form-select">
                            <option>Mensual</option>
                            <option>Trimestral</option>
                            <option selected>Semestral</option>
                            <option>Anual</option>
                        </select>
                    </div>
                    <div class="row g-3">
                        <div class="col-8"><label class="form-label" for="nA">Número de pagos (n)</label><input id="nA"
                                type="number" class="form-control" min="1" step="any" placeholder="Ej: 24"></div>
                        <div class="col-4"><label class="form-label" for="kA">Gracia (k)</label><input id="kA"
                                type="number" class="form-control" min="0" step="any" value="0"></div>
                    </div>
                    <div class="d-flex gap-2 mt-4">
                        <button id="calc-anualidad" class="btn btn-primary flex-grow-1">Calcular</button>
                        <button id="reset-anualidad" class="btn btn-outline-secondary">Limpiar</button>
                    </div>
                    <div id="result-anualidad"></div>
                </div>
            </section>
            <section class="col-lg-7">
                <div class="calc-card h-100">
                    <h4>Procedimiento</h4>
                    <div id="steps-anualidad" class="steps mt-3"></div>
                    <div class="chart-box mt-4"><canvas id="chart-anualidad" height="180"></canvas></div>
                </div>
            </section>
        </div>
    </main><iframe class="footer-frame" src="templates/footer.html" title="Pie de página" scrolling="no"></iframe>
    <script src="../js/core.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script src="../js/anualidades.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
