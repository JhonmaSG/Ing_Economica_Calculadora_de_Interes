<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Amortización | Ingeniería Económica</title>
    <link rel="stylesheet" href="../vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../vendor/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../vendor/katex/katex.min.css">
    <script defer src="../vendor/katex/katex.min.js"></script>
    <script defer src="../vendor/katex/auto-render.min.js"></script>
    <link rel="stylesheet" href="../style2.css">
</head>

<body>
    <iframe class="nav-frame" src="templates/nav.html" title="Navegación principal" scrolling="no" ></iframe><script>window.addEventListener("message",function(event){if(!event.data||event.data.type!=="nav-toggle")return;var frame=document.querySelector(".nav-frame");if(frame)frame.style.height=event.data.open?"300px":"72px";});</script>
    <header class="page-header">
        <div class="container">
            <h2>Amortización</h2>
            <p class="mb-0">Calcula la cuota y genera una tabla completa para los sistemas francés y alemán.</p>
        </div>
    </header>
    <main class="container py-4">
        <div class="row g-4">
            <section class="col-lg-4">
                <div class="calc-card">
                    <h5>Datos del crédito</h5><label class="form-label" for="cred">Monto del crédito (VP)</label><input
                        id="cred" type="number" class="form-control mb-3" min="0" step="any"
                        placeholder="Ej: 10000000"><label class="form-label" for="iC">Tasa por período (%)</label><input
                        id="iC" type="number" class="form-control mb-3" min="0.000001" step="any"
                        placeholder="Ej: 1.5"><label class="form-label" for="nC">Número de cuotas</label><input id="nC"
                        type="number" class="form-control mb-3" min="1" step="1" placeholder="Ej: 36"><label
                        class="form-label" for="sistema-amort">Sistema</label><select id="sistema-amort"
                        class="form-select mb-4">
                        <option value="frances">Francés: cuota fija</option>
                        <option value="aleman">Alemán: abono constante</option>
                    </select>
                    <div class="d-flex gap-2">
                        <button id="calc-amort" class="btn btn-primary flex-grow-1">Generar</button>
                        <button id="reset-amort" class="btn btn-outline-secondary">Limpiar</button></div>
                    <div id="result-amort"></div>
                </div>
            </section>
            <section class="col-lg-8">
                <div class="calc-card">
                    <h4>Tabla y procedimiento</h4>
                    <div id="steps-amort" class="steps mt-3"></div>
                    <div id="amort-table" class="mt-3"></div>
                    <div class="chart-box mt-3" id="chart-amort-box" style="display:none"><canvas id="chart-amort"
                            height="220"></canvas></div>
                </div>
            </section>
        </div>
    </main><iframe class="footer-frame" src="templates/footer.html" title="Pie de página" scrolling="no"></iframe>
    <script src="../js/core.js"></script>
    <script src="../vendor/chart.js/chart.umd.min.js"></script>
    <script src="../js/credito.js"></script>
    <script src="../vendor/bootstrap/bootstrap.bundle.min.js"></script>
</body>

</html>
