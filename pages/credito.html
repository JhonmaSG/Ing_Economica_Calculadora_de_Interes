<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amortización | Ingeniería Económica</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script><link rel="stylesheet" href="../style.css"></head><body><nav class="navbar navbar-expand-lg navbar-dark"><div class="container"><a class="navbar-brand" href="../index.html">Ingeniería Económica</a><button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="nav"><ul class="navbar-nav ms-auto"><li><a class="nav-link" href="../index.html">Inicio</a></li><li><a class="nav-link" href="interes-compuesto.html">Interés compuesto</a></li><li><a class="nav-link" href="tasas.html">Tasas</a></li><li><a class="nav-link" href="anualidades.html">Anualidades</a></li><li><a class="nav-link" href="ecuacion-valor.html">Ecuación de valor</a></li><li><a class="nav-link active" href="credito.html">Amortización</a></li></ul></div></div></nav><header class="page-header"><div class="container"><span class="eyebrow">Módulo 5</span><h2>Amortización</h2><p class="mb-0">Calcula la cuota y genera una tabla completa para los sistemas francés y alemán.</p></div></header><main class="container py-4"><div class="row g-4"><section class="col-lg-4"><div class="calc-card"><h5>Datos del crédito</h5><label class="form-label" for="cred">Monto del crédito (VP)</label><input id="cred" type="number" class="form-control mb-3" min="0" step
