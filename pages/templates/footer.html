<!doctype html>
<html lang="es">

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

    html,
    body {
      width: 100%;
      height: 72px;
      min-height: 0;
      margin: 0;
      overflow: hidden;
      background: transparent;

    body {
      background: rgba(50, 50, 44, .97);
      color: #e8f4eb;
      font: 600 14px/1.5 'Nunito Sans', sans-serif;
    }

    footer {
      min-height: 72px;
      display: flex;
      align-items: center;

      text-align: center;
      padding: 0 1rem;
      box-sizing: border-box;
      box-shadow: 0 -5px 20px rgba(50, 50, 44, .2);
    }

    .separator {
      margin: 0 .5rem;
      color: #62a87c;
      font-weight: 800;
    }
  </style>
</head>

<body>
  <footer>
    <span>Ingeniería Económica</span>
    <span class="separator">·</span>

</html>
